<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 监测系统 · 战略咨询</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e6e9ef;
    --text: #1a1f2e;
    --muted: #7a8296;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --green: #16a34a;
    --green-soft: #eaf7ef;
    --amber: #d97706;
    --amber-soft: #fef3e2;
    --red: #dc2626;
    --red-soft: #fdecec;
    --gray-soft: #f1f3f6;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.06);
    --radius: 12px;
  }
  [data-theme="dark"] {
    --bg: #0f1218;
    --card: #171b24;
    --border: #262c38;
    --text: #e6e9f0;
    --muted: #8b93a5;
    --accent: #818cf8;
    --accent-soft: #23263a;
    --green: #34d399;
    --green-soft: #12301f;
    --amber: #fbbf24;
    --amber-soft: #33250a;
    --red: #f87171;
    --red-soft: #331418;
    --gray-soft: #1d222d;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5;
    transition: background .2s, color .2s;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 24px 48px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
  }
  .brand h1 { font-size: 18px; font-weight: 700; }
  .brand p { font-size: 12px; color: var(--muted); }
  .head-actions { display: flex; align-items: center; gap: 10px; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); }
  .icon-btn { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; font-size: 16px; }

  /* KPI */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 28px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.5px; }
  .kpi .sub { font-size: 12px; color: var(--muted); }
  .delta-up { color: var(--green); font-weight: 600; }
  .delta-down { color: var(--red); font-weight: 600; }

  /* Section */
  .section { margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .card .hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  /* Charts */
  .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .charts-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .charts, .charts-2, .kpi-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .kpi-grid { grid-template-columns: 1fr; } }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* Bars */
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .bar-name { width: 90px; flex-shrink: 0; text-align: right; color: var(--muted); }
  .bar-track { flex: 1; background: var(--gray-soft); border-radius: 6px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width .4s; }
  .bar-val { width: 46px; flex-shrink: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Doughnut */
  .doughnut-wrap { display: flex; align-items: center; gap: 18px; }
  .doughnut-legend { flex: 1; font-size: 12px; }
  .doughnut-legend .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .doughnut-legend .name { flex: 1; color: var(--muted); }
  .doughnut-legend .val { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Filters */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters select, .filters input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 13px; min-width: 120px;
  }
  .filters input.search { flex: 1; min-width: 180px; }
  .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 600; font-size: 12px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: var(--gray-soft); }
  .q-text { font-weight: 600; }
  .platform { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge.p0 { background: var(--red-soft); color: var(--red); }
  .badge.p1 { background: var(--amber-soft); color: var(--amber); }
  .badge.p2 { background: var(--gray-soft); color: var(--muted); }
  .badge.client { background: var(--green-soft); color: var(--green); }
  .badge.comp { background: var(--amber-soft); color: var(--amber); }
  .badge.none { background: var(--gray-soft); color: var(--muted); }
  .rank { font-variant-numeric: tabular-nums; font-weight: 600; }
  .spark { display: inline-block; }

  /* Modal */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(10,14,22,.5); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    max-width: 640px; width: 100%; max-height: 88vh; overflow: auto; padding: 22px;
  }
  .modal h3 { font-size: 16px; margin-bottom: 4px; }
  .modal .meta { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .modal .close { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .timeline { list-style: none; margin-top: 12px; }
  .timeline li { position: relative; padding-left: 20px; padding-bottom: 16px; font-size: 13px; }
  .timeline li::before {
    content: ""; position: absolute; left: 4px; top: 5px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
  }
  .timeline li::after {
    content: ""; position: absolute; left: 8px; top: 14px; bottom: 0; width: 1px; background: var(--border);
  }
  .timeline li:last-child::after { display: none; }
  .timeline .t { color: var(--muted); font-size: 12px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--card); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">G</div>
      <div>
        <h1>GEO 监测系统</h1>

    </div>
    <div class="head-actions">
      <button class="btn icon-btn" id="themeBtn" title="切换主题">🌙</button>

  </header>

  <!-- KPI -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- Charts -->
  <div class="section charts">

    </div>

      <h2>竞品引用对比</h2>

    </div>
  </div>

  <div class="section charts-2" style="margin-top:14px;">
    <div class="card">
      <h2>查询词分类分布</h2>
      <div class="hint">词库 103 个高价值查询的分类构成</div>
      <div class="doughnut-wrap">
        <svg id="doughnut" width="150" height="150" viewBox="0 0 130 130"></svg>
        <div class="doughnut-legend" id="doughnutLegend"></div>
      </div>
    </div>
    <div class="card">
      <h2>监测覆盖</h2>
      <div class="hint">词库监测进度</div>

    </div>
  </div>

  <!-- Table -->
  <div class="section card" style="margin-top:14px;">
    <h2>查询词引用监测</h2>
    <div class="hint">点击任意行查看引用历史与优化建议</div>
    <div class="filters">
      <select id="fPlatform"><option value="">全部平台</option><option>ChatGPT</option><option>Perplexity</option><option>Gemini</option><option>AI Overviews</option></select>
      <select id="fCategory"><option value="">全部分类</option></select>
      <select id="fPriority"><option value="">全部优先级</option><option>P0</option><option>P1</option><option>P2</option></select>
      <select id="fStatus"><option value="">全部状态</option><option value="client">客户被引用</option><option value="comp">竞品被引用</option><option value="none">未覆盖</option></select>
      <input class="search" id="fSearch" placeholder="搜索查询词…">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>查询词</th><th>平台</th><th>分类</th><th>优先级</th><th>引用来源</th><th>排名</th><th>近 7 天趋势</th><th>上次监测</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none;">没有匹配的查询词</div>
    </div>
  </div>

  <p class="note">演示数据 · 将下方 JS 中的 <code>DATA</code> 替换为后端 API 返回即可接入真实监测</p>
</div>

<!-- Modal -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 数据层：演示数据。接入真实系统时，把 DATA 替换为 fetch('/api/...') 的返回即可。
 * 字段：query 查询词 | platform 平台 | category 分类 | priority 优先级
 *       source 被引用来源 | position 引用排名(null=未覆盖) | isClient 是否客户被引用
 *       trend 近7次排名序列(越小越好) | lastChecked 上次监测时间
 * ============================================================ */
const DATA = [
  { query:"最好的战略咨询公司有哪些", platform:"ChatGPT", category:"公司选择与对比", priority:"P0", source:"客户", position:2, isClient:true,  trend:[3,3,2,2,1,1,2], lastChecked:"12:01" },
  { query:"战略咨询公司排名 2026", platform:"Perplexity", category:"公司选择与对比", priority:"P0", source:"麦肯锡", position:1, isClient:false, trend:[1,1,1,1,1,1,1], lastChecked:"12:00" },
  { query:"麦肯锡 波士顿 贝恩 怎么选", platform:"Gemini", category:"公司选择与对比", priority:"P0", source:"贝恩", position:3, isClient:false, trend:[2,3,3,3,3,3,3], lastChecked:"11:58" },
  { query:"中国本土战略咨询公司有哪些", platform:"ChatGPT", category:"公司选择与对比", priority:"P0", source:"客户", position:1, isClient:true,  trend:[2,2,1,1,1,1,1], lastChecked:"11:55" },
  { query:"战略咨询公司收费 标准", platform:"Perplexity", category:"价格与投入", priority:"P0", source:"客户", position:1, isClient:true,  trend:[3,2,2,1,1,1,1], lastChecked:"11:52" },
  { query:"战略咨询项目 多少钱", platform:"AI Overviews", category:"价格与投入", priority:"P0", source:"和君咨询", position:1, isClient:false, trend:[1,1,2,1,1,1,1], lastChecked:"11:50" },
  { query:"请咨询公司 值不值", platform:"ChatGPT", category:"价值与ROI", priority:"P0", source:"客户", position:3, isClient:true,  trend:[5,4,4,3,3,3,3], lastChecked:"11:48" },
  { query:"战略咨询 能带来什么价值", platform:"Gemini", category:"价值与ROI", priority:"P0", source:"客户", position:2, isClient:true,  trend:[4,3,3,2,2,2,2], lastChecked:"11:45" },
  { query:"战略规划怎么做", platform:"ChatGPT", category:"方法论与框架", priority:"P1", source:"客户", position:1, isClient:true,  trend:[1,1,1,1,1,1,1], lastChecked:"11:42" },
  { query:"波特五力模型 怎么用", platform:"Perplexity", category:"方法论与框架", priority:"P1", source:"正略咨询", position:1, isClient:false, trend:[1,1,1,1,1,1,1], lastChecked:"11:40" },
  { query:"增长战略 怎么做", platform:"ChatGPT", category:"方法论与框架", priority:"P1", source:"客户", position:4, isClient:true,  trend:[5,5,4,4,4,4,4], lastChecked:"11:38" },
  { query:"数字化转型战略 怎么做", platform:"Gemini", category:"方法论与框架", priority:"P1", source:"BCG", position:2, isClient:false, trend:[2,2,2,2,2,2,2], lastChecked:"11:35" },
  { query:"零售行业 增长战略", platform:"ChatGPT", category:"细分行业场景", priority:"P1", source:"客户", position:2, isClient:true,  trend:[4,4,3,3,2,2,2], lastChecked:"11:32" },
  { query:"制造业 数字化转型 怎么做", platform:"Perplexity", category:"细分行业场景", priority:"P1", source:"—", position:null, isClient:false, trend:[null,null,null,null,null,null,null], lastChecked:"11:30" },
  { query:"战略咨询是什么", platform:"AI Overviews", category:"行业认知科普", priority:"P2", source:"麦肯锡", position:1, isClient:false, trend:[1,1,1,1,1,1,1], lastChecked:"11:28" },
  { query:"如何进麦肯锡", platform:"ChatGPT", category:"求职与职业", priority:"P1", source:"麦肯锡", position:1, isClient:false, trend:[1,1,1,1,1,1,1], lastChecked:"11:25" },
  { query:"case interview 怎么准备", platform:"Perplexity", category:"求职与职业", priority:"P1", source:"知乎", position:2, isClient:false, trend:[2,2,2,2,2,2,2], lastChecked:"11:22" },
  { query:"AI 对咨询行业的影响", platform:"Gemini", category:"趋势与前沿", priority:"P1", source:"客户", position:1, isClient:true,  trend:[2,2,1,1,1,1,1], lastChecked:"11:20" },
  { query:"中国企业 出海战略", platform:"ChatGPT", category:"趋势与前沿", priority:"P1", source:"客户", position:3, isClient:true,  trend:[4,4,3,3,3,3,3], lastChecked:"11:18" },
  { query:"咨询公司 会被AI取代吗", platform:"Perplexity", category:"趋势与前沿", priority:"P2", source:"财新", position:1, isClient:false, trend:[1,1,1,1,1,1,1], lastChecked:"11:15" },
];

const CATEGORIES = [
  { name:"公司选择与对比", value:18, color:"#4f46e5" },
  { name:"方法论与框架", value:20, color:"#06b6d4" },
  { name:"细分行业场景", value:12, color:"#8b5cf6" },
  { name:"行业认知科普", value:12, color:"#f59e0b" },
  { name:"趋势与前沿", value:10, color:"#10b981" },
  { name:"求职与职业", value:9,  color:"#ec4899" },
  { name:"价值与ROI", value:8,  color:"#6366f1" },
  { name:"价格与投入", value:7,  color:"#14b8a6" },
  { name:"英文全球查询", value:7, color:"#94a3b8" },
];

const TREND_SERIES = [
  { name:"客户", color:"#4f46e5", data:[12,14,15,17,18,20,21,22] },
  { name:"麦肯锡", color:"#94a3b8", data:[30,29,28,28,27,27,26,26] },
  { name:"行业Top3均值", color:"#10b981", data:[24,24,23,22,22,21,21,20] },
];
const WEEKS = ["W1","W2","W3","W4","W5","W6","W7","W8"];

const COMPETITORS = [
  { name:"麦肯锡", value:28, color:"#94a3b8" },
  { name:"客户", value:22, color:"#4f46e5" },
  { name:"BCG", value:16, color:"#06b6d4" },
  { name:"贝恩", value:14, color:"#8b5cf6" },
  { name:"和君咨询", value:8, color:"#f59e0b" },
  { name:"正略咨询", value:6, color:"#10b981" },
  { name:"其他", value:6, color:"#cbd5e1" },
];

const PALETTE = ["#4f46e5","#06b6d4","#8b5cf6","#f59e0b","#10b981","#ec4899","#6366f1","#14b8a6","#94a3b8"];

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- KPI ---------- */
function renderKPI() {
  const total = 103;
  const monitored = DATA.length;
  const cited = DATA.filter(d => d.isClient).length;
  const rate = Math.round(cited / monitored * 100);
  const positions = DATA.filter(d => d.isClient && d.position).map(d => d.position);
  const avgRank = (positions.reduce((a,b)=>a+b,0) / positions.length).toFixed(1);

  const cards = [
    { label:"监测查询总数", value:total, sub:`已监测 ${monitored} · 待监测 ${total-monitored}` },
    { label:"客户被引用率", value:rate+"%", sub:`<span class="delta-up">▲ +6%</span> 较上周` },
    { label:"平均引用排名", value:avgRank, sub:`<span class="delta-up">▲ -0.3</span> 排名上升` },
    { label:"本周新增引用", value:"+4", sub:`<span class="delta-up">▲ 3</span> 个平台` },
  ];
  $("#kpiGrid").innerHTML = cards.map(c =>
    `<div class="kpi"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub">${c.sub}</div></div>`
  ).join("");
}

/* ---------- 折线图（纯 SVG） ---------- */
function renderTrend() {
  $("#trendLegend").innerHTML = TREND_SERIES.map(s =>
    `<span><span class="dot" style="background:${s.color}"></span>${s.name}</span>`).join("");
  const svg = $("#trendChart");
  const W = 560, H = 220, padL = 34, padR = 10, padT = 14, padB = 26;
  const maxV = 35;
  const x = i => padL + (W - padL - padR) * i / (WEEKS.length - 1);
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);

  let grid = "";
  for (let g = 0; g <= maxV; g += 10) {
    grid += `<line x1="${padL}" y1="${y(g)}" x2="${W-padR}" y2="${y(g)}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y(g)+4}" fill="var(--muted)" font-size="10" text-anchor="end">${g}%</text>`;
  }
  let xlabels = WEEKS.map((w,i) => `<text x="${x(i)}" y="${H-8}" fill="var(--muted)" font-size="10" text-anchor="middle">${w}</text>`).join("");

  const lines = TREND_SERIES.map(s => {
    const pts = s.data.map((v,i) => `${x(i)},${y(v)}`).join(" ");
    const area = s.data.map((v,i) => `${x(i)},${y(v)}`).join(" ") + ` ${x(s.data.length-1)},${H-padB} ${x(0)},${H-padB}`;
    return `<polygon points="${area}" fill="${s.color}" opacity="0.08"/>
            <polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");
  svg.innerHTML = grid + xlabels + lines;
}

/* ---------- 竞品横向柱状图 ---------- */
function renderBars() {
  const max = Math.max(...COMPETITORS.map(c => c.value));
  $("#competitorBars").innerHTML = COMPETITORS.map(c => {
    const highlight = c.name === "客户";
    return `<div class="bar-row">
      <div class="bar-name" style="${highlight?'color:var(--accent);font-weight:700':''}">${c.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${c.value/max*100}%;background:${c.color}"></div></div>
      <div class="bar-val">${c.value}%</div>
    </div>`;
  }).join("");
}

/* ---------- 环形图 ---------- */
function renderDoughnut() {
  const total = CATEGORIES.reduce((a,c)=>a+c.value,0);
  const R = 52, C = 2 * Math.PI * R;
  let offset = 0, segs = "";
  CATEGORIES.forEach(c => {
    const len = c.value / total * C;
    segs += `<circle cx="65" cy="65" r="${R}" fill="none" stroke="${c.color}" stroke-width="16"
              stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 65 65)"/>`;
    offset += len;
  });
  segs += `<text x="65" y="61" fill="var(--text)" font-size="22" font-weight="700" text-anchor="middle">${total}</text>
           <text x="65" y="78" fill="var(--muted)" font-size="10" text-anchor="middle">总词数</text>`;
  $("#doughnut").innerHTML = segs;
  $("#doughnutLegend").innerHTML = CATEGORIES.map(c =>
    `<div class="row"><span class="dot" style="background:${c.color}"></span>
      <span class="name">${c.name}</span><span class="val">${c.value}</span></div>`).join("");
}

/* ---------- 覆盖进度 ---------- */
function renderCoverage() {
  const total = 103, monitored = DATA.length;
  const pct = Math.round(monitored/total*100);
  $("#coverage").innerHTML = `
    <div style="font-size:26px;font-weight:700;margin:6px 0;">${monitored}<span style="font-size:14px;color:var(--muted)"> / ${total}</span></div>
    <div class="bar-track" style="height:10px;margin:10px 0;"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div></div>
    <div style="font-size:12px;color:var(--muted);">监测覆盖率 ${pct}% · 建议优先补全 P0 对比与价格词</div>`;
}

/* ---------- 迷你趋势线 ---------- */
function sparkline(trend, positive) {
  const w = 90, h = 24, pad = 3;
  const vals = trend.filter(v => v !== null);
  if (vals.length < 2) return `<span class="spark">—</span>`;
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const pts = trend.map((v,i) => {
    const vv = v === null ? min : v;
    return `${pad + (w-2*pad)*i/(trend.length-1)},${pad + (h-2*pad)*(1-(vv-min)/range)}`;
  });
  const color = positive ? "var(--green)" : "var(--red)";
  const line = pts.join(" ");
  const area = line + ` ${w-pad},${h-pad} ${pad},${h-pad}`;
  return `<svg class="spark" width="${w}" height="${h}">
    <polygon points="${area}" fill="${color}" opacity="0.12"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- 表格 ---------- */
function statusBadge(d) {
  if (d.isClient) return `<span class="badge client">客户被引用</span>`;
  if (d.position === null) return `<span class="badge none">未覆盖</span>`;
  return `<span class="badge comp">竞品被引用</span>`;
}
function prioBadge(p) { return `<span class="badge ${p.toLowerCase()}">${p}</span>`; }

function renderTable(rows) {
  const body = $("#tableBody");
  if (!rows.length) { body.innerHTML = ""; $("#emptyState").style.display = "block"; return; }
  $("#emptyState").style.display = "none";
  body.innerHTML = rows.map((d,i) => `
    <tr data-idx="${DATA.indexOf(d)}">
      <td class="q-text">${esc(d.query)}</td>
      <td class="platform">${d.platform}</td>
      <td>${esc(d.category)}</td>
      <td>${prioBadge(d.priority)}</td>
      <td>${statusBadge(d)}</td>
      <td class="rank">${d.position ? "第 "+d.position+" 位" : "—"}</td>
      <td>${sparkline(d.trend, d.isClient)}</td>
      <td class="platform">${d.lastChecked}</td>
    </tr>`).join("");
  body.querySelectorAll("tr").forEach(tr => {
    tr.addEventListener("click", () => openModal(DATA[+tr.dataset.idx]));
  });
}

/* ---------- 筛选 ---------- */
function applyFilters() {
  const p = $("#fPlatform").value, c = $("#fCategory").value, pr = $("#fPriority").value,
        st = $("#fStatus").value, q = $("#fSearch").value.trim().toLowerCase();
  const rows = DATA.filter(d =>
    (!p || d.platform === p) &&
    (!c || d.category === c) &&
    (!pr || d.priority === pr) &&
    (!st || (st==="client" ? d.isClient : st==="none" ? d.position===null : (!d.isClient && d.position!==null))) &&
    (!q || d.query.toLowerCase().includes(q))
  );
  renderTable(rows);
}

/* ---------- 详情弹窗 ---------- */
function openModal(d) {
  const hist = buildHistory(d);
  $("#modalBox").innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <h3>${esc(d.query)}</h3>
    <div class="meta">${d.platform} · ${esc(d.category)} · ${prioBadge(d.priority)} · 上次监测 ${d.lastChecked}</div>
    <div>${statusBadge(d)} ${d.position ? `<span class="rank" style="margin-left:6px;">当前排名：第 ${d.position} 位</span>` : ""}</div>
    <h4 style="margin:18px 0 4px;font-size:13px;">近 7 天引用排名趋势</h4>
    <div style="margin:8px 0;">${sparklineBig(d.trend, d.isClient)}</div>
    <h4 style="margin:18px 0 4px;font-size:13px;">引用历史</h4>
    <ul class="timeline">${hist}</ul>
    <h4 style="margin:18px 0 4px;font-size:13px;">优化建议</h4>
    <p style="font-size:13px;color:var(--muted);">${suggestion(d)}</p>
  `;
  $("#modalMask").classList.add("show");
}
function sparklineBig(trend, positive) {
  const w = 560, h = 120, pad = 10;
  const vals = trend.filter(v => v !== null);
  if (vals.length < 2) return "<span>暂无数据</span>";
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max-min) || 1;
  const pts = trend.map((v,i) => {
    const vv = v === null ? min : v;
    return `${pad+(w-2*pad)*i/(trend.length-1)},${pad+(h-2*pad)*(1-(vv-min)/range)}`;
  });
  const color = positive ? "var(--green)" : "var(--red)";
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="${pts.join(' ')} ${w-pad},${h-pad} ${pad},${h-pad}" fill="${color}" opacity="0.12"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>`;
}
function buildHistory(d) {
  const t = d.trend.slice(-4);
  const items = t.map((v,i) => ({
    day: `D-${t.length-i-1}`,
    text: v === null ? "未被任何来源引用" : `排名第 ${v} 位 · ${d.isClient ? "客户被引用" : d.source+" 被引用"}`,
  }));
  return items.map(x => `<li><span class="t">${x.day}</span> — ${x.text}</li>`).join("");
}
function suggestion(d) {
  if (d.isClient && d.position === 1) return "已占据首位，保持内容更新频率，防止被竞品反超。";
  if (d.isClient) return "客户已被引用但排名靠后，建议强化直接回答式开头与结构化清单，补充独家数据提升引用位次。";
  if (d.position === null) return "该词尚未被覆盖，属于引用空白机会点，优先产出权威方法论/榜单内容抢占。";
  return `当前被「${d.source}」引用，建议输出差异化内容（独家榜单/白皮书/案例）以争取被并列引用。`;
}
function closeModal() { $("#modalMask").classList.remove("show"); }
$("#modalMask").addEventListener("click", e => { if (e.target.id === "modalMask") closeModal(); });

/* ---------- 主题 ---------- */
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  $("#themeBtn").textContent = next === "light" ? "🌙" : "☀️";
}

/* ---------- 监测按钮 & Toast ---------- */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}
$("#runBtn").addEventListener("click", () => {
  const btn = $("#runBtn");
  btn.textContent = "⏳ 监测中…"; btn.disabled = true;
  setTimeout(() => {
    btn.textContent = "▶ 立即监测"; btn.disabled = false;
    toast("✅ 完成 20 个查询监测，新增 4 个客户引用");
    renderTable(DATA);
  }, 1400);
});

/* ---------- 事件绑定 & 初始化 ---------- */
$("#themeBtn").addEventListener("click", toggleTheme);
["fPlatform","fCategory","fPriority","fStatus","fSearch"].forEach(id =>
  $("#"+id).addEventListener("input", applyFilters)
);

// 分类下拉选项
const cats = [...new Set(DATA.map(d => d.category))];
$("#fCategory").innerHTML = '<option value="">全部分类</option>' + cats.map(c => `<option>${c}</option>`).join("");

renderKPI();
renderTrend();
renderBars();
renderDoughnut();
renderCoverage();
renderTable(DATA);
</script>
</body>
</html>
